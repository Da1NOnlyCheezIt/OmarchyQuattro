# =====================================================================
# 1. WAYLAND CORE & DISPLAY ENVS (Organized & Modernized)
# =====================================================================
env = XDG_SESSION_TYPE,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb

# =====================================================================
# 2. NVIDIA HARDWARE ACCELERATION
# =====================================================================
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = VK_DRIVER_FILES,/usr/share/vulkan/icd.d/nvidia_icd.json
env = WLR_NO_HARDWARE_CURSORS,1   # Often required for NVIDIA cursors

# =====================================================================
# 3. STEAMVR / INDEX SPECIFIC CONFIGS
# =====================================================================
env = STEAMVR_USE_XWAYLAND,1
env = STEAMVR_FORCE_XWAYLAND,1
env = STEAMVR_DIRECT_MODE,1
env = AQUAMARINE_DRM_LEASE,1
env = __GL_GSYNC_ALLOWED,0
env = __GL_SYNC_TO_VBLANK,0

# =====================================================================
# 4. COMPATIBILITY TOGGLES (Commented out by default unless needed)
# =====================================================================
env = SDL_AUDIODRIVER,pulseaudio
# env = WLR_DRM_NO_ATOMIC,1
#env = XDG_TEMPLATES_DIR,$HOME/.config/nautilus/Templates
